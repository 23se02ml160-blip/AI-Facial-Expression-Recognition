<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>
    /* Profile Picture Styles */
    .profile-pic-container {
        text-align: center;
        margin-bottom: 25px;
    }
    .profile-pic-container img {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        border: 4px solid #2563eb;
        object-fit: cover;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .file-input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background: #f8fafc;
        margin-bottom: 15px;
    }
    .upload-btn {
        background: #2563eb;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 8px;
        width: 100%;
        cursor: pointer;
        font-weight: bold;
    }
    .upload-btn:hover {
        background: #1d4ed8;
    }
</style>

</head>

<body>

<header class="navbar">

<div class="logo">
<i class="fa-solid fa-brain"></i>
AI Facial Expression Recognition
</div>

</header>

<div class="settings-page">

<div class="settings-card">

<h2>
<i class="fa-solid fa-gear"></i>
Application Settings
</h2>

<!-- Error Message -->
{% if error %}
<div class="error-message">{{ error }}</div>
{% endif %}

<!-- PROFILE PICTURE SECTION (Connects to /settings POST) -->
<h3 style="text-align: center; margin-bottom: 10px;">Update Profile Picture</h3>
<div class="profile-pic-container">
    <img src="{{ url_for('static', filename=profile_pic) }}" alt="Profile Picture">
</div>

<form action="/settings" method="POST" enctype="multipart/form-data">
    <label>Choose New Image</label>
    <input type="file" class="file-input" name="profile_pic" accept="image/*" required>
    <button type="submit" class="upload-btn">Upload New Picture</button>
</form>

<hr style="margin: 30px 0; border: 1px solid #eee;">

<!-- EXISTING SETTINGS (Visual/UI only for your report) -->
<form>

<label>Camera Resolution</label>

<select>
<option>640 × 480</option>
<option selected>1280 × 720</option>
<option>1920 × 1080</option>
</select>

<label>Recognition Confidence</label>

<input
type="range"
min="50"
max="100"
value="80">

<label>

<input type="checkbox" checked>

Enable Sound Alerts

</label>

<label>

<input type="checkbox" checked>

Save Attendance Logs

</label>

<br>

<button class="camera-btn home-btn">
Save Settings
</button>

</form>

<br>

<a href="{{ url_for('index') }}"
class="home-btn register-btn">

Back to Home

</a>

</div>

</div>

</body>
</html>
