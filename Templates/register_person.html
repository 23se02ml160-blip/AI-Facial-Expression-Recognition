<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t.register_person }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #8b5cf6 100%);
            min-height: 100vh; margin: 0; font-family: 'Poppins', sans-serif;
        }
        .register-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .register-card {
            width: 500px; background: rgba(8, 20, 45, 0.92);
            border: 1px solid rgba(37, 99, 235, 0.35); padding: 40px;
            border-radius: 20px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px); color: white;
            max-height: 95vh; overflow-y: auto;
        }
        .register-card h1 { text-align: center; margin-bottom: 35px; color: #ffffff; font-size: 34px; font-weight: 700; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #ffffff; }
        .input-group input {
            width: 100%; padding: 15px 18px; border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px; font-size: 16px; transition: .3s;
            background: rgba(0, 0, 0, 0.3); color: white; box-sizing: border-box;
        }
        .input-group input:focus { outline: none; border-color: #00d2ff; box-shadow: 0 0 12px rgba(0, 210, 255, 0.25); }
        .save-btn {
            width: 100%; padding: 16px; background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 18px; font-weight: 600; transition: .3s;
        }
        .save-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(37, 99, 235, .35); }
        .back-btn { display: block; text-align: center; margin-top: 18px; color: #ffffff; font-weight: 600; transition: .3s; text-decoration: none; }
        .back-btn:hover { color: #00d2ff; }
        .otp-section { margin-top: 20px; padding: 20px; background: rgba(0, 0, 0, 0.4); border: 2px dashed #3b82f6; border-radius: 12px; text-align: center; }
        .otp-heading { color: #00d2ff; font-size: 18px; margin-bottom: 10px; }
        .otp-status { color: #fbbf24; font-size: 14px; margin-bottom: 15px; font-weight: 500; }
        .otp-input {
            width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #ccc;
            border-radius: 8px; font-size: 16px; box-sizing: border-box; text-align: center; letter-spacing: 5px;
            background: #1a1a1a; color: white;
        }
        .otp-input:focus { border-color: #00d2ff; outline: none; }
        .otp-btn { width: 100%; padding: 14px; background: #28a745; border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .otp-btn:hover { background: #218838; }
        .resend-btn {
            background: none; border: none; color: #00d2ff; cursor: not-allowed;
            text-decoration: underline; font-size: 14px;
        }
        .resend-btn.active {
            cursor: pointer;
            color: #ffcc00;
        }
    </style>
</head>
<body>
<div class="register-container">
    <div class="register-card">
        <h1><i class="fa-solid fa-user-plus"></i> {{ t.register_person }}</h1>

        <form action="/register_person" method="POST">
            <div class="input-group">
                <label>{{ t.name }}</label>
                <input type="text" name="name" placeholder="{{ t.enter_full_name }}" required>
            </div>
            <div class="input-group">
                <label>{{ t.username }}</label>
                <input type="text" name="username" placeholder="{{ t.enter_username }}" required>
            </div>
            <div class="input-group">
                <label>{{ t.email }}</label>
                <input type="email" name="email" placeholder="{{ t.enter_email }}" required>
            </div>
            <div class="input-group">
                <label>{{ t.phone }}</label>
                <input type="text" name="phone" placeholder="{{ t.enter_phone }}" required>
            </div>
            <button type="submit" class="save-btn">
                <i class="fa-solid fa-floppy-disk"></i> {{ t.save_person }}
            </button>
        </form>

        {% if show_otp %}
        <div class="otp-section">
            <h3 class="otp-heading">{{ t.enter_otp }} {{ email }}</h3>
            <p class="otp-status">{{ status }}</p>
            <form action="/verify_otp" method="POST">
                <input type="text" name="otp" class="otp-input" placeholder="{{ t.enter_otp_code }}" maxlength="6" required>
                <button type="submit" class="otp-btn">{{ t.verify_continue }}</button>
            </form>

            <div style="text-align: center; margin-top: 15px;">
                <button id="resendBtn" type="button" class="resend-btn" disabled>
                    {{ t.resend_otp }} 60s
                </button>
            </div>
        </div>
        {% endif %}

        <br>
        <a href="{{ url_for('index') }}" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> {{ t.back_to_home }}
        </a>
    </div>
</div>

<!-- Countdown & Resend Script -->
<script>
    let timeLeft = 60;
    const resendBtn = document.getElementById('resendBtn');

    function startTimer() {
        const timer = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timer);
                resendBtn.disabled = false;
                resendBtn.classList.add('active');
                resendBtn.innerText = "{{ t.resend_otp }}";
            } else {
                resendBtn.disabled = true;
                resendBtn.classList.remove('active');
                resendBtn.innerText = "{{ t.resend_otp }} " + timeLeft + "s";
                timeLeft--;
            }
        }, 1000);
    }
    if (resendBtn) startTimer();

    if (resendBtn) {
        resendBtn.addEventListener('click', () => {
            resendBtn.disabled = true;
            resendBtn.classList.remove('active');
            timeLeft = 60;
            resendBtn.innerText = "{{ t.resending }}...";
            fetch('/resend_otp', { method: 'POST', headers: {'Content-Type': 'application/json'} })
            .then(response => response.json())
            .then(data => {
                const statusEl = document.querySelector('.otp-status');
                if (statusEl) statusEl.innerText = data.message;
                const timer = setInterval(() => {
                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        resendBtn.disabled = false;
                        resendBtn.classList.add('active');
                        resendBtn.innerText = "{{ t.resend_otp }}";
                    } else {
                        resendBtn.disabled = true;
                        resendBtn.innerText = "{{ t.resend_otp }} " + timeLeft + "s";
                        timeLeft--;
                    }
                }, 1000);
            })
            .catch(error => { console.error('Error:', error); alert("Failed to resend OTP."); });
        });
    }
</script>
</body>
</html>
