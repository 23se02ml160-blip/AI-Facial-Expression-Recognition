<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Person</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url("../static/images/home-bg.jpg");
            background-size: cover; background-position: center; background-attachment: fixed;
            color: white; font-family: 'Poppins', sans-serif; margin: 0; padding: 40px;
        }
        .edit-container { max-width: 600px; margin: 0 auto; padding: 40px; background: rgba(8, 20, 45, 0.92); border: 1px solid rgba(37, 99, 235, 0.35); border-radius: 20px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); backdrop-filter: blur(12px); }
        h1 { text-align: center; color: #00d2ff; margin-bottom: 30px; }
        
        /* Full-width inputs with proper spacing */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .form-group input { width: 100%; padding: 15px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; background: rgba(0, 0, 0, 0.3); color: white; font-size: 16px; box-sizing: border-box; }
        .form-group input:focus { outline: none; border-color: #00d2ff; box-shadow: 0 0 12px rgba(0, 210, 255, 0.25); }

        .update-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #2563eb, #4f46e5); color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; transition: .3s; }
        .update-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(37, 99, 235, .35); }

        .back-btn { display: block; text-align: center; margin-top: 20px; color: #ffffff; font-weight: 600; text-decoration: none; }
        .back-btn:hover { color: #00d2ff; }
    </style>
</head>
<body>
    <div class="edit-container">
        <h1><i class="fa-solid fa-user-pen"></i> Edit Person</h1>
        <form method="POST">
            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" value="{{ person['name'] }}" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ person['email'] }}">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" value="{{ person['phone'] }}">
            </div>
            <button type="submit" class="update-btn"><i class="fa-solid fa-floppy-disk"></i> Update</button>
        </form>
        <a href="{{ url_for('registered_persons') }}" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Registered Persons</a>
    </div>
</body>
</html>
