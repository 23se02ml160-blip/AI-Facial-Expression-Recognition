<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Person Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url("../static/images/home-bg.jpg");
            background-size: cover; background-position: center; background-attachment: fixed;
            color: white; font-family: 'Poppins', sans-serif; margin: 0; padding: 40px;
        }
        .details-container { max-width: 600px; margin: 0 auto; padding: 40px; background: rgba(8, 20, 45, 0.92); border: 1px solid rgba(37, 99, 235, 0.35); border-radius: 20px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); backdrop-filter: blur(12px); }
        h1 { text-align: center; color: #00d2ff; margin-bottom: 30px; }
        
        .info-row { padding: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); font-size: 18px; }
        .info-row span { color: #00d2ff; font-weight: bold; }

        .action-buttons { display: flex; flex-direction: column; gap: 15px; margin-top: 30px; }
        .btn { padding: 15px; border-radius: 10px; text-align: center; text-decoration: none; color: white; font-weight: 600; transition: .3s; }
        
        .btn-train { background: #2563eb; } .btn-train:hover { background: #1d4ed8; }
        .btn-edit { background: #ff9800; } .btn-edit:hover { background: #e68900; }
        .btn-capture { background: #10b981; } .btn-capture:hover { background: #059669; }
        .btn-back { background: #6c757d; } .btn-back:hover { background: #5a6268; }
    </style>
</head>
<body>
    <div class="details-container">
        <h1><i class="fa-solid fa-id-badge"></i> Person Details</h1>
        
        <div class="info-row"><span>Name :</span> {{ person['name'] }}</div>
        <div class="info-row"><span>Username :</span> {{ person['username'] }}</div>
        <div class="info-row"><span>Email :</span> {{ person['email'] }}</div>
        <div class="info-row"><span>Phone :</span> {{ person['phone'] }}</div>

        <div class="action-buttons">
            <a href="{{ url_for('train_face', username=person['username']) }}" class="btn btn-train"><i class="fa-solid fa-camera"></i> Train Face</a>
            <a href="{{ url_for('edit_person', username=person['username']) }}" class="btn btn-edit"><i class="fa-solid fa-pen-to-square"></i> Edit</a>
            <a href="{{ url_for('capture_more_images', username=person['username']) }}" class="btn btn-capture"><i class="fa-solid fa-images"></i> Capture More Images</a>
            <a href="{{ url_for('registered_persons') }}" class="btn btn-back"><i class="fa-solid fa-arrow-left"></i> Back</a>
        </div>
    </div>
</body>
</html>
