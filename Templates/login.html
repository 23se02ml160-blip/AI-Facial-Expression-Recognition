<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">

    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url("{{ url_for('static', filename='images/login_bg.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }

        .overlay {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
        }

        .otp-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }
        .otp-section h3 { margin-bottom: 10px; color: #00d2ff; }
        .otp-section input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #1a1a1a;
            color: white;
            box-sizing: border-box;
            text-align: center;
            letter-spacing: 4px;
        }
        .otp-section button { background: #28a745; width: 100%; }
    </style>
</head>

<body>
    <div class="overlay">
        <div class="login-box">
            <h1>AI Facial Expression Recognition</h1>
            <p>Detect Human Emotions in Real-Time</p>

            {% if error %}<div class="error">{{ error }}</div>{% endif %}
            {% if success %}<div class="success">{{ success }}</div>{% endif %}

            <form action="/login" method="POST">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>

            <!-- OTP Section -->
            {% if show_otp %}
            <div class="otp-section">
                <h3>Enter OTP sent to {{ email }}</h3>
                <p style="color: yellow; font-size: 14px; margin-bottom: 10px;">{{ status }}</p>
                <form action="/verify_otp" method="POST">
                    <input type="text" name="otp" placeholder="Enter 6-digit code" maxlength="6" required>
                    <button type="submit">Verify & Continue</button>
                </form>

                <!-- NEW: Resend OTP Button -->
                <div style="text-align: center; margin-top: 15px;">
                    <button id="resendBtn" type="button" disabled style="background: none; border: none; color: #00d2ff; cursor: not-allowed; text-decoration: underline; font-size: 14px;">
                        Resend OTP in 60s
                    </button>
                </div>
            </div>
            {% endif %}

            <div class="signup-link">
                <p>Don't have an account? <a href="{{ url_for('signup') }}">Sign Up</a></p>
            </div>
        </div>
    </div>

    <!-- NEW: Countdown & Resend Script -->
    <script>
        let timeLeft = 60;
        const resendBtn = document.getElementById('resendBtn');
        function startTimer() {
            const timer = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    resendBtn.disabled = false;
                    resendBtn.innerText = "Resend OTP";
                    resendBtn.style.cursor = "pointer";
                    resendBtn.style.color = "#ffcc00";
                } else {
                    resendBtn.disabled = true;
                    resendBtn.style.cursor = "not-allowed";
                    resendBtn.style.color = "#00d2ff";
                    resendBtn.innerText = "Resend OTP in " + timeLeft + "s";
                    timeLeft--;
                }
            }, 1000);
        }
        if (resendBtn) startTimer();

        if (resendBtn) {
            resendBtn.addEventListener('click', () => {
                resendBtn.disabled = true;
                timeLeft = 60;
                resendBtn.innerText = "Resending...";
                fetch('/resend_otp', { method: 'POST', headers: {'Content-Type': 'application/json'} })
                .then(response => response.json())
                .then(data => {
                    const statusEl = document.querySelector('.otp-section p');
                    if (statusEl) statusEl.innerText = data.message;
                    const timer = setInterval(() => {
                        if (timeLeft <= 0) {
                            clearInterval(timer);
                            resendBtn.disabled = false;
                            resendBtn.innerText = "Resend OTP";
                            resendBtn.style.cursor = "pointer";
                        } else {
                            resendBtn.disabled = true;
                            resendBtn.innerText = "Resend OTP in " + timeLeft + "s";
                            timeLeft--;
                        }
                    }, 1000);
                })
                .catch(error => { console.error('Error:', error); alert("Failed to resend OTP."); });
            });
        }
    </script>
</body>
</html>
