<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ t.change_password }}</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>
    .password-page {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 90vh;
        padding: 20px;
        box-sizing: border-box;
    }
    .password-card {
        width: 100%;
        max-width: 450px;
        background: rgba(8, 20, 45, 0.92);
        border: 1px solid rgba(37, 99, 235, 0.35);
        border-radius: 20px;
        padding: 40px;
        color: white;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(12px);
    }
    .password-card h2 {
        text-align: center;
        color: #00d2ff;
        margin-bottom: 30px;
        font-size: 26px;
    }
    .password-card form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    .password-card input {
        width: 100%;
        padding: 15px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.3);
        color: white;
        font-size: 15px;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }
    .password-card input:focus {
        outline: none;
        border-color: #00d2ff;
        box-shadow: 0 0 12px rgba(0, 210, 255, 0.25);
    }
    .password-card input::placeholder {
        color: #888;
    }
    .update-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
        font-family: 'Poppins', sans-serif;
    }
    .update-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
    }
    .error-message {
        background: rgba(239, 68, 68, 0.2);
        color: #fca5a5;
        padding: 12px;
        border-radius: 8px;
        border-left: 4px solid #ef4444;
        margin-bottom: 15px;
        text-align: center;
    }
    .success-message {
        background: rgba(34, 197, 94, 0.2);
        color: #86efac;
        padding: 12px;
        border-radius: 8px;
        border-left: 4px solid #22c55e;
        margin-bottom: 15px;
        text-align: center;
    }
    .back-btn {
        display: block;
        text-align: center;
        margin-top: 20px;
        padding: 12px;
        background: #10b981;
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-weight: 600;
        transition: 0.3s;
    }
    .back-btn:hover {
        background: #059669;
        transform: translateY(-2px);
    }
</style>

</head>

<body>

<header class="navbar">
    <div class="logo">
        <i class="fa-solid fa-brain"></i>
        AI Facial Expression Recognition
    </div>
</header>

<div class="password-page">
    <div class="password-card">

        <h2><i class="fa-solid fa-key"></i> {{ t.change_password }}</h2>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="success-message">{{ success }}</div>
        {% endif %}

        <!-- ✅ FIXED: method, action, and name attributes -->
        <form method="POST" action="/change_password">
            <input type="password"
                   name="current_password"
                   placeholder="{{ t.current_password }}"
                   required>

            <input type="password"
                   name="new_password"
                   placeholder="{{ t.new_password }}"
                   required>

            <input type="password"
                   name="confirm_password"
                   placeholder="{{ t.confirm_new_password }}"
                   required>

            <button type="submit" class="update-btn">
                <i class="fa-solid fa-lock"></i> {{ t.update_password }}
            </button>
        </form>

        <a href="{{ url_for('index') }}" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> {{ t.back_to_home }}
        </a>

    </div>
</div>

</body>
</html>
